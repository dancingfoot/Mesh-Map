<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- mesh links between the nodes -->
  <g stroke="url(#link)" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="150" y1="300" x2="256" y2="176"/>
    <line x1="256" y1="176" x2="368" y2="286"/>
    <line x1="150" y1="300" x2="368" y2="286"/>
    <line x1="256" y1="176" x2="256" y2="352"/>
  </g>

  <!-- nodes -->
  <g fill="#e2e8f0">
    <circle cx="256" cy="176" r="34"/>
    <circle cx="150" cy="300" r="26"/>
    <circle cx="368" cy="286" r="26"/>
  </g>
  <circle cx="256" cy="352" r="22" fill="#22d3ee"/>

  <!-- location pin, the tracking half of the app -->
  <path d="M256 96c-40 0-72 32-72 72 0 54 72 126 72 126s72-72 72-126c0-40-32-72-72-72z"
        fill="none" stroke="#22d3ee" stroke-width="0" />
</svg>
