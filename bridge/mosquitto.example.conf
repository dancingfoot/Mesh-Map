# Example Mosquitto configuration for a standalone local Mesh Map deployment.
#
# Copy this to /etc/mosquitto/mosquitto.conf (or run:
#     mosquitto -c bridge/mosquitto.example.conf
# ) and the dashboard's MQTT bridge can talk to it over TCP on 1883.
#
# The dashboard also launches mosquitto automatically with
#     npm run bridge:mqtt -- --launch-mosquitto
# when the binary is installed, using this file.

# --- plain MQTT for the native bridge (browser cannot open raw TCP) ----------
listener 1883 127.0.0.1
protocol mqtt

# --- WebSocket listener, in case a client wants to speak MQTT directly -------
listener 9001 127.0.0.1
protocol websockets

# --- a local-only broker needs no TLS or authentication ----------------------
allow_anonymous true

# --- persist subscriptions/retained messages across restarts -----------------
persistence true
persistence_location /var/lib/mosquitto/

# --- keep the logs useful ----------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
